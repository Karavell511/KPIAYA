[project]
name = "kpiaya"
version = "0.1.0"
description = "Production-ready KPI platform with Telegram auth, RBAC, audit, sharing, exports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "aiogram>=3.10.0",
  "apscheduler>=3.10.4",
  "httpx>=0.27.0",
  "reportlab>=4.2.2",
  "openpyxl>=3.1.5",
  "python-dateutil>=2.9.0",
  "orjson>=3.10.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
